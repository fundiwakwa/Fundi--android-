
name: Build Fundi Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Fundi project
        run: |
          unzip -o Fundi_Android_APK_Project.zip -d project
          cp -r project/app .
          cp project/build.gradle .
          cp project/settings.gradle .
          cp project/gradle.properties .

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java and Kotlin targets
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle
          sed -i 's/"1.8"/"17"/g' app/build.gradle

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fundi-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
