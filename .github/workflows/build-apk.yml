
name: Inspect Fundi Android Configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Fundi project
        run: |
          unzip -o Fundi_Android_APK_Project.zip -d project
          cp -r project/app .
          cp project/build.gradle .
          cp project/settings.gradle .
          cp project/gradle.properties .

      - name: Show Android Gradle configuration
        run: |
          echo "===== APP BUILD.GRADLE ====="
          cat app/build.gradle
          echo "===== END CONFIGURATION ====="
